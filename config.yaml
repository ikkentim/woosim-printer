# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-config
name: "Receipt Printer Service"
version: "1.1.1"
slug: receiptprinter_service
url: https://github.com/ikkentim/woosim-printer
description: >-
  Daily briefing / to-do scheduler for a Woosim receipt printer - prints
  over the network to ReceiptPrinter.NetworkSerialService, which runs on
  the PC with the actual printer wired up over serial.
arch:
  - amd64
  - aarch64
init: false
image: ghcr.io/ikkentim/ha-{arch}-receiptprinter-service
# Grants access to Home Assistant's Core API through Supervisor's proxy (http://supervisor/core/...),
# authenticated with the automatically-injected SUPERVISOR_TOKEN env var - no personal long-lived access
# token needed. Leave HomeAssistant.BaseUrl/Token below empty to use this.
homeassistant_api: true
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: HTTP API (POST /print, /briefing/trigger, /todos/check)
options:
  Printer:
    Type: "network"
    NetworkHost: "printer-pc.local:5251"
  Location:
    Latitude: 52.5546
    Longitude: 5.9114
    LocationName: "Kampen"
  HomeAssistant:
    BaseUrl: ""
    Token: ""
    TodoEntityId: "sensor.todo_list"
    TodoAttributeName: "items"
    SolarProductionEntityId: ""
    GridImportEntityIds: []
    GridExportEntityIds: []
    GasEntityId: ""
  Briefing:
    Language: "nl"
    Widgets:
      - "DateHeader"
      - "Weather"
      - "Calendar"
      - "Todo"
      - "Energy"
    TodoNotesEnabled: true
    ScheduledBriefingEnabled: true
    ScheduledHour: 7
    ScheduledMinute: 0
schema:
  Printer:
    Type: "list(serial|network)"
    NetworkHost: str
  Location:
    Latitude: float
    Longitude: float
    LocationName: str
  HomeAssistant:
    BaseUrl: "str?"
    Token: "password?"
    TodoEntityId: str
    TodoAttributeName: "str?"
    SolarProductionEntityId: "str?"
    GridImportEntityIds: ["str"]
    GridExportEntityIds: ["str"]
    GasEntityId: "str?"
  Briefing:
    Language: "list(nl|en)"
    Widgets: ["str"]
    TodoNotesEnabled: bool
    ScheduledBriefingEnabled: bool
    ScheduledHour: "int(0,23)"
    ScheduledMinute: "int(0,59)"
