# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-config
name: "Receipt Printer Service"
version: "1.2.0"
slug: receiptprinter_service
url: https://github.com/ikkentim/woosim-printer
description: >-
  Daily briefing / to-do printer for a Woosim receipt printer, triggered from
  Home Assistant automations (HTTP or MQTT) - prints over the network to
  ReceiptPrinter.NetworkSerialService, which runs on the PC with the actual
  printer wired up over serial.
arch:
  - amd64
  - aarch64
init: false
image: ghcr.io/ikkentim/ha-{arch}-receiptprinter-service
# Grants access to Home Assistant's Core API through Supervisor's proxy (http://supervisor/core/...),
# authenticated with the automatically-injected SUPERVISOR_TOKEN env var - no personal long-lived access
# token needed, and no BaseUrl/Token option below to fill in. Also used to read HA's own configured
# latitude/longitude for the weather widget - see HomeAssistantLocation.cs.
homeassistant_api: true
# "want" (not "need"): the add-on still runs fine with no MQTT broker configured in Home Assistant -
# it just skips publishing the button/notify/sensor entities described in Mqtt.Enabled below.
services:
  - mqtt:want
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: HTTP API (POST /print, /briefing/trigger, /todos/check)
options:
  Printer:
    Type: "network"
    NetworkHost: "printer-pc.local:5251"
  HomeAssistant:
    TodoEntityId: "sensor.todo_list"
    TodoAttributeName: "items"
    SolarProductionEntityId: ""
    GridImportEntityIds: []
    GridExportEntityIds: []
    GasEntityId: ""
  Briefing:
    Language: "nl"
    Widgets:
      - "DateHeader"
      - "Weather"
      - "Calendar"
      - "Todo"
      - "Energy"
    TodoNotesEnabled: true
  Mqtt:
    Enabled: true
schema:
  Printer:
    Type: "list(serial|network)"
    NetworkHost: str
  HomeAssistant:
    TodoEntityId: str
    TodoAttributeName: "str?"
    SolarProductionEntityId: "str?"
    GridImportEntityIds: ["str"]
    GridExportEntityIds: ["str"]
    GasEntityId: "str?"
  Briefing:
    Language: "list(nl|en)"
    Widgets: ["str"]
    TodoNotesEnabled: bool
  Mqtt:
    Enabled: bool
