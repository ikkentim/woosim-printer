; ESP32 firmware for the standalone receipt printer (see ../docs/HARDWARE.md).
;
; It is a deliberately dumb HTTP -> UART bridge, matching the contract that
; ReceiptPrinter.NetworkSerialService implements in C#:
;
;   POST /print   - copy the application/octet-stream body to the UART, byte for byte
;   GET  /health  - return 200 without touching the printer
;
; All Receipt -> ESC/POS translation happens on the sender (EscPosEncoder).
;
; Board: LOLIN (WeMos) D1 Mini ESP32.

; Machine-local overrides (OTA auth, etc.) live in *.local.ini, which is
; git-ignored - no password ends up in a tracked file. The glob matches nothing
; on a fresh clone, which is fine. See ota.local.ini.example.
; bare `pio run` / `pio run -t upload` = USB only; OTA is `pio run -e ota -t upload`
[platformio]
extra_configs = *.local.ini
default_envs = d1_mini_esp32

[env:d1_mini_esp32]
platform = espressif32
board = wemos_d1_mini32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = -DCORE_DEBUG_LEVEL=1

; OTA target. Real upload_protocol / upload_port / upload_flags come from
; ota.local.ini (git-ignored). Without that file this just mirrors the USB env.
[env:ota]
extends = env:d1_mini_esp32
